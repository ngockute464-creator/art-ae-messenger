# OFFICE BRANCH ONLY. Netlify branch deploy must be enabled in existing project.
[build]
  command = "node office-site/build.mjs"
  publish = "office-site/dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

# No functions, no Supabase/Yandex environment variables.

name: Verify ART-AE VPS release

on:
  push:
    branches: [netlify-preview, migration/local-postgres, feature/message-counts-read, feature/pwa-safe-autoupdate, feature/web-push, fix/push-controls, fix/service-worker-activation, feature/message-erasure-unlimited-files, feature/mobile-composer-voice-gesture, fix/composer-focus-persistence, feature/chat-media-preview-copy, fix/chat-media-streaming, fix/mobile-media-viewer-layout]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assemble release
        run: |
          set -euo pipefail
          unzip -oq artae.zip -d .
          node build/prepare.mjs

      - name: Validate app and server modules
        run: |
          set -euo pipefail
          test -s public/index.html
          test -s public/sw.js
          test -s public/app.js
          node --check public/app.js
          node --check public/sw.js
          node --check public/pwa-client.js
          node --check server/pwa-safety-patch.mjs
          node --check server/push-client.js
          node --check server/push-patch.mjs
          node --check public/push-client.js
          node --check migration/runtime/push.mjs
          node --check migration/runtime/push-worker.mjs
          node --check migration/runtime/push-transport.mjs
          node migration/tests/test-push-artifacts.mjs
          node migration/tests/test-push-controls.mjs
          test -s migration/sql/004_web_push.sql
          grep -q "artaePushControls" public/push-client.js
          grep -q "ARTAE_PUSH_OPEN" public/sw.js
          grep -q "artae_push_deliveries" migration/runtime/sync.mjs
          node migration/tests/test-pwa-update.mjs
          node migration/tests/test-sw-install.mjs
          node migration/tests/test-message-erasure-and-files.mjs
          node migration/tests/test-pwa-runtime.mjs
          node migration/tests/check-ui-markup.mjs
          node migration/tests/test-mobile-composer-voice.mjs
          node migration/tests/test-mobile-composer-interactions.mjs
          node migration/tests/test-composer-focus.mjs
          node migration/tests/test-chat-media.mjs
          node migration/tests/test-mobile-media-viewer.mjs
          node --test tests/e12-composer.test.mjs tests/e9-voice.test.mjs
          node --check server/unread-client.js
          node --check server/unread-patch.mjs
          node --check migration/runtime/unread.mjs
          test -s migration/sql/003_message_reads.sql
          grep -q 'artae-message-counts' public/styles.css
          grep -q 'artaeScanReadMessages' public/app.js
          node --check vps-server.mjs
          for name in http-server auth sync postgres pins files-explorer voice voice-transcript project-rename; do
            test -s "migration/runtime/$name.mjs"
            node --check "migration/runtime/$name.mjs"
          done
          if grep -nE 'SUPABASE_URL|SUPABASE_SECRET_KEY|/rest/v1/' migration/runtime/*.mjs; then
            echo "Forbidden remote database dependency in production API"
            exit 1
          fi
          test -s public/office/quire/index.html
          test -s public/office/ledger/index.html
          test -s public/office/artae-bridge.js
          for module in auth sync pins files-explorer realtime-token voice voice-transcript; do
            test -f "netlify/functions/$module.mjs"
            node --check "netlify/functions/$module.mjs"
          done

      - name: Check pinned Web Push transport with Node 24
        run: |
          set -euo pipefail
          mkdir -p /tmp/artae-push-ci
          npm install --prefix /tmp/artae-push-ci --no-save --ignore-scripts --no-audit --no-fund web-push@3.6.7
          node -e "const w=require('/tmp/artae-push-ci/node_modules/web-push'); const k=w.generateVAPIDKeys(); if(!k.publicKey||!k.privateKey)process.exit(1); console.log('PUSH_TRANSPORT_OK')"

      - name: Check deployment script syntax
        run: |
          bash -n deploy/artae-release.sh
          bash -n deploy/artae-auto.sh
          bash -n migration/deploy/switch-local.sh
          bash -n migration/deploy/apply-message-reads.sh
          bash -n migration/deploy/bootstrap-push.sh
          bash -n migration/deploy/apply-message-erasure.sh


  verify-unread-postgres:
    if: github.ref == 'refs/heads/feature/message-counts-read' || github.ref == 'refs/heads/feature/web-push' || github.ref == 'refs/heads/feature/message-erasure-unlimited-files'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: stage1_test_password
          POSTGRES_DB: artae
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d artae"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Check additive migration and read receipts
        env:
          PGPASSWORD: stage1_test_password
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGDATABASE=artae
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE artae_app LOGIN;'
          psql -v ON_ERROR_STOP=1 -f migration/sql/001_clean_schema.sql
          psql -v ON_ERROR_STOP=1 -f migration/sql/002_office_lease.sql
          psql -v ON_ERROR_STOP=1 -f migration/tests/unread-fixtures.sql
          psql -v ON_ERROR_STOP=1 -f migration/sql/003_message_reads.sql
          psql -v ON_ERROR_STOP=1 -f migration/sql/003_message_reads.sql
          psql -v ON_ERROR_STOP=1 -f migration/tests/unread-verify.sql
          psql -v ON_ERROR_STOP=1 -f migration/sql/004_web_push.sql
          psql -v ON_ERROR_STOP=1 -f migration/sql/004_web_push.sql
          psql -v ON_ERROR_STOP=1 -f migration/tests/push-fixtures.sql
          psql -v ON_ERROR_STOP=1 -f migration/tests/seed-deleted-message.sql
          psql -v ON_ERROR_STOP=1 -f migration/sql/005_erase_deleted_text.sql
          psql -v ON_ERROR_STOP=1 -f migration/sql/005_erase_deleted_text.sql
          psql -v ON_ERROR_STOP=1 -f migration/tests/verify-deleted-text.sql
